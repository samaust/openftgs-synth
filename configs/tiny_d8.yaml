# tiny with the 8-coefficient rational model (k1 k2 p1 p2 k3 k4 k5 k6), opencv-yaml layout.
# The principal point is off-centre here (the n3dv constraint does not apply).
extends: tiny.yaml
name: tiny_d8
lens:
  principal_offset_px: [1.3, -0.9]
  principal_jitter_px: 0.6
  distortion: [0.11, -0.02, 0.0003, -0.0002, 0.001, 0.26, -0.015, 0.002]
  distortion_jitter: [0.1, 0.1, 0.5, 0.5, 0.2, 0.1, 0.1, 0.2]
layouts:
  - {layout: enerf_outdoor, frames: distorted}
