# SPDX-License-Identifier: GPL-3.0-or-later
# kitchen: n3dv layout. 20 cameras on a forward-facing arc, all looking at the table.
# Pinhole, principal point at the image centre, fx = fy.
name: kitchen
builder: kitchen
width: 1352
height: 1014
fps: 30
frames: 300
preroll_seconds: 1.0
names: cam
rig:
  type: arc
  n: 20
  seed: 101
  target: [0.0, 0.45, 0.85]
  radius: 2.7
  azimuth_deg: [-34, 34]
  height: [1.45, 1.62]       # alternating rows
  azimuth_jitter_deg: 0.8
  radius_jitter: 0.08
  height_jitter: 0.04
  target_jitter: 0.06
  roll_jitter_deg: 0.0
lens:
  hfov_deg: 60
  focal_jitter: 0.0
  principal_offset_px: [0, 0]
  principal_jitter_px: 0.0
  distortion: []
render:
  samples: 32
  denoise: true
  denoise_gpu: true         # owner decision 2026-10-13: GPU OIDN (repeat renders differ by <= 115/65535)
  marker_samples: 512
layouts:
  - {layout: n3dv, frames: pinhole}
validation_frame_step: 25
markers:
  box: [[-2.6, 2.6], [-0.9, 2.2], [0.05, 2.4]]
  radius: 0.01
  count: 160
  min_sep_px: 30
  seed: 7
clock:
  p0: [-0.6, 0.0, 1.3]
  velocity: [0.12, 0.02, 0.0]
  radius: 0.01
